name: Build apps
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Also build Windows, Mac and Linux apps"
        type: boolean
        default: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in data-*.zip; do unzip -oq "$f"; done; ls www; ls www/img | wc -l
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JEE-PYQ-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  desktop:
    if: ${{ inputs.desktop }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: for f in data-*.zip; do unzip -oq "$f"; done
        shell: bash
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: JEE-PYQ-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
